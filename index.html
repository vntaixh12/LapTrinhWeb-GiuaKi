<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giữa Kì</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#about">Giới thiệu</a></li>
                <li><a href="#skill">Kỹ năng</a></li>
                <li><a href="#project">Dự án</a></li>
                <li><a href="#contact">Liên hệ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about">
            <h1>Xin Chào, Tôi tên là Võ Anh Tài</h1>
            <p>Tôi là sinh viên năm 2 ngành kỹ thuật phần mềm tại trường đại học Gia Định.</p>
        </section>
        <section id="skill">
            <h2>Kỹ năng</h2>
            <div id="skills-list"></div>
            <table>
                <thead>
                    <tr><th>Kỹ năng</th><th>Mức độ</th></tr>
                </thead>
                <tbody>
                    <tr>
                        <td>HTML</td>
                        <td>Khá</td>
                    </tr>
                    <tr>
                        <td>CSS/SCSS</td>
                        <td>Trung bình</td>
                    </tr>
                    <tr>
                        <td>Java</td>
                        <td>Trung bình</td>
                    </tr>
                </tbody>
            </table>
        </section>
        <section id="project">
            <h2>Dự án</h2>
            <div id="projects-list"></div>
        </section>
        <section id="contact">
            <h2>Liên hệ</h2>
            <form id="contact-form">
                <label for="name">Tên:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="tel">Số điện thoại:</label>
                <input type="tel" id="tel" name="tel" required>

                <label for="date">Ngày:</label>
                <input type="date" id="date" name="date" required>

                <button type="submit">Gửi</button>
            </form>
            <p id="formMessage"></p>
        </section>        
    </main>
    <footer>
        <p>&copy; 2026 Võ Anh Tài. All rights reserved.</p>
        <button id="toggleTheme">Đổi chủ đề</button>
    </footer>
</body>
</html>
